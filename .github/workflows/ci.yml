# The determinism gate, in CI. Minutes, not hours — a gate nobody waits for is
# a gate nobody runs.
#
# Order matters and mirrors CLAUDE.md: the cheap static checks fail first, then
# the unit tests, then the differential that is the point of the whole project.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    # Postgres for the migration and store tests. Without it they skip, and the
    # schema is a file nobody has ever run — the one part of the backend a fake
    # store cannot check is whether the SQL is valid and the constraints the
    # schema promises are really enforced. A service container costs seconds.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: universus
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:dev@localhost:5432/universus

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      # For tools/sprites.py. A managed interpreter rather than the runner's
      # system python, which refuses `pip install` outside a virtualenv.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - run: go vet ./...

      # The invariant with teeth: the sim is 16.16 fixed-point, so a float
      # anywhere under sim/ is a determinism bug that has not fired yet.
      - name: Float ban
        run: |
          if grep -rnE '\b(float32|float64)\b|"math"' ./sim/; then
            echo "::error::floats in sim/ — the sim is fixed-point only"
            exit 1
          fi

      # The sprite sheets carry a move-index-to-tag table (D113), because the
      # view gets a moveIndex and sim.Move has no name to give it. Nothing at
      # runtime proves that table still matches the embedded character data:
      # add a move, forget to regenerate, and the wrong animation plays with no
      # error anywhere. Regenerating here and refusing a diff makes the drift
      # impossible rather than merely detectable.
      #
      # Only the JSON is compared. The PNGs are pixels out of whatever Pillow
      # the runner installed, and byte-identical output across versions is not
      # a promise anyone made — the tags are the thing that can silently rot.
      - name: Sprite tags match the roster
        run: |
          python3 -m pip install --quiet Pillow
          python3 tools/sprites.py
          if ! git diff --quiet -- 'client/public/sprites/*.json'; then
            echo "::error::sprite sheets are stale — run tools/sprites.py and commit"
            git diff -- 'client/public/sprites/*.json'
            exit 1
          fi

      # Includes the rollback correctness test: 100 frames, then the same
      # inputs with forced rollbacks of depth 1–8, checksums must match.
      - run: go test ./...

      # Builds the WASM sim itself and diffs per-frame checksums against native
      # over the whole testdata/ corpus.
      - name: Determinism gate
        run: tools/determinism.sh

      # Shared runners are noisy, but the M0 bars have ~20x headroom — this
      # fails on a regression, not on a slow neighbour.
      - name: Performance regression
        run: node tools/bench.mjs

      - run: pnpm install --frozen-lockfile
        working-directory: client

      - run: pnpm lint
        working-directory: client

      # The WASM binary and wasm_exec.js are build output, so they are not in the
      # repo — and src/sim/wasm.test.ts loads the real one, because a byte layout
      # agreed with a mock is a layout nobody checked. Built here rather than in
      # `pnpm build`, which runs after the tests that need it.
      - run: pnpm wasm
        working-directory: client

      # Includes the bot-vs-bot harness (D49): two headless clients, two real
      # WASM sims, scripted inputs and 100 ms / 15 ms jitter / 5% loss. With one
      # machine and no partner on call it is the primary desync detector, so CI
      # plays three seeded matches rather than one — each is about a second, and
      # BOT_SEEDS raises it for an unattended soak.
      - run: pnpm exec vitest run
        working-directory: client
        env:
          BOT_SEEDS: 3

      - run: pnpm build
        working-directory: client
